<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lorcana Ability Editor &amp; Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.basic.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --inkwell: #0A0F1E;
            --vellum: #121A2E;
            --vellum-2: #1A2440;
            --rule: #2A3654;
            --text: #E7ECF6;
            --text-dim: #93A0BC;
            --text-faint: #5C6A8A;
            --ink-amber: #E9B44C;
            --ink-sapphire: #59A7F2;
            --ink-ruby: #EF6070;
            --ink-emerald: #4CC38A;
            --ink-amethyst: #A78BFA;
            --ink-steel: #94A3B8;
            --match-fill: rgba(76,195,138,.22);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--inkwell);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        .display { font-family: 'Marcellus', serif; letter-spacing: 0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ink-steel); }

        /* App frame */
        #app-frame { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        #app-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 0 16px; min-height: 56px;
            border-bottom: 1px solid var(--rule); background: var(--vellum);
            flex-shrink: 0;
        }
        #app-bar .title { font-size: 22px; color: var(--text); white-space: nowrap; }
        #app-bar .title .quill { color: var(--ink-amber); }
        #app-bar .meta { font-size: 12px; color: var(--text-faint); }
        .bar-actions { display: flex; align-items: center; gap: 8px; }

        /* Buttons */
        .btn {
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
            border-radius: 8px; padding: 8px 14px; cursor: pointer;
            border: 1px solid transparent; transition: background .15s ease-out, border-color .15s ease-out, color .15s ease-out;
            white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--ink-amber); color: #1A1305; }
        .btn-primary:hover { background: #f0c266; }
        .btn-secondary { background: transparent; color: var(--text); border-color: var(--rule); }
        .btn-secondary:hover { background: var(--vellum-2); }
        .btn-danger { background: transparent; color: var(--ink-ruby); border-color: var(--ink-ruby); }
        .btn-danger:hover, .btn-danger.confirm { background: var(--ink-ruby); color: #1A0508; }
        .icon-btn {
            min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--rule); background: transparent; color: var(--text);
            cursor: pointer; transition: background .15s ease-out; font-size: 16px;
        }
        .icon-btn:hover { background: var(--vellum-2); }
        .icon-btn.primary { background: var(--ink-amber); color: #1A1305; border-color: var(--ink-amber); }

        .save-dot { color: var(--ink-amber); font-size: 10px; }
        .save-dot.hidden { display: none; }

        /* Panels */
        #panels { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 240px 1fr 480px; gap: 0; }
        #rail { border-right: 1px solid var(--rule); background: var(--vellum); overflow-y: auto; padding: 12px; }
        #center { display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--inkwell); }
        #inspector { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-left: 1px solid var(--rule); background: var(--vellum); }

        .panel-head { padding: 12px 16px; border-bottom: 1px solid var(--rule); flex-shrink: 0; }
        .rail-title { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; font-weight: 600; }

        /* Tree */
        .tnav-item {
            padding: 7px 10px; cursor: pointer; border-radius: 6px; border-left: 3px solid transparent;
            transition: background .15s ease-out, color .15s ease-out; font-weight: 500; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center; color: var(--text-dim);
        }
        .tnav-item:hover { background: var(--vellum-2); color: var(--text); }
        .tnav-item.active { border-left-color: var(--ink-amber); color: var(--ink-amber); background: var(--vellum-2); }
        .tnav-item.subtype { padding-left: 24px; font-size: 13px; font-weight: 400; }
        .tnav-item .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-faint); }
        .tnav-item.active .count { color: var(--ink-amber); }

        /* Inputs */
        .inp {
            background: var(--vellum-2); border: 1px solid var(--rule); color: var(--text);
            border-radius: 8px; padding: 8px 12px; width: 100%; font-family: 'Inter', sans-serif; font-size: 14px;
            transition: border-color .15s ease-out;
        }
        .inp::placeholder { color: var(--text-faint); }
        .inp:focus-visible, .inp:focus { outline: none; border-color: var(--ink-amber); box-shadow: 0 0 0 2px rgba(233,180,76,.45); }
        .inp.mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-amethyst); }
        .inp.ta { resize: none; overflow-y: hidden; min-height: 40px; line-height: 1.5; }
        .inp.err { border-color: var(--ink-ruby) !important; box-shadow: 0 0 0 1px var(--ink-ruby); }
        .lbl { display: block; font-size: 13px; color: var(--text-dim); font-weight: 500; margin-bottom: 4px; }
        .fld { min-width: 0; }

        :focus-visible { outline: none; }
        .btn:focus-visible, .icon-btn:focus-visible, .tnav-item:focus-visible, .prow-head:focus-visible, .tab-btn:focus-visible {
            outline: 2px solid var(--ink-amber); outline-offset: 2px;
        }

        /* Filter bar */
        .filter-bar { padding: 12px 16px; border-bottom: 1px solid var(--rule); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .filter-wrap { position: relative; flex: 1 1 auto; }
        .filter-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-faint); pointer-events: none; }
        .filter-wrap .inp { padding-left: 34px; }
        #cat-sheet-btn { display: none; }

        .active-filter-chip { display: none; align-items: center; gap: 6px; padding: 4px 10px; margin: 8px 16px 0; background: var(--vellum-2); border: 1px solid var(--rule); border-radius: 999px; font-size: 12px; color: var(--text-dim); width: fit-content; }
        .active-filter-chip button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; line-height: 1; }

        /* Pattern list */
        #pattern-list { overflow-y: auto; flex: 1 1 auto; padding: 12px 16px; min-height: 0; }
        .prow { border: 1px solid var(--rule); border-radius: 10px; background: var(--vellum); margin-bottom: 10px; overflow: hidden; transition: border-color .2s ease-out; }
        .prow.open { border-color: var(--ink-amber); }
        .prow-head {
            width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;
            display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: var(--text);
        }
        .prow-head:hover { background: var(--vellum-2); }
        .chev { color: var(--text-faint); transition: transform .2s ease-out; flex-shrink: 0; font-size: 12px; }
        .prow.open .chev { transform: rotate(90deg); }
        .prow-name { font-size: 16px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
        .chip { font-size: 12px; color: var(--text-dim); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 8px; white-space: nowrap; flex-shrink: 0; }
        .prow-regex { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-amethyst); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
        .badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--text-faint); flex-shrink: 0; }
        .badge.pos { color: var(--ink-emerald); border-color: var(--ink-emerald); }
        .badge.zero { color: var(--text-faint); }
        .badge.bad { color: var(--ink-ruby); border-color: var(--ink-ruby); }
        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot.invalid { background: var(--ink-ruby); }
        .dot.match-sel { background: var(--ink-emerald); box-shadow: 0 0 6px rgba(76,195,138,.7); }
        .dot.hidden { display: none; }

        .prow-body { padding: 4px 14px 16px; border-top: 1px solid var(--rule); }
        .prow-body.hidden { display: none; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stack { display: flex; flex-direction: column; gap: 12px; }
        .calc-section { margin-top: 16px; padding: 12px; background: rgba(0,0,0,.18); border: 1px solid var(--rule); border-radius: 10px; }
        .calc-head { font-size: 18px; color: var(--text); margin: 0 0 4px; font-weight: 600; }
        .sub-head { font-size: 13px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 8px; }
        .lbl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .rgx-status { font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: 4px; min-height: 16px; }
        .rgx-status.ok { color: var(--ink-emerald); }
        .rgx-status.bad { color: var(--ink-ruby); }
        .rgx-status.neutral { color: var(--text-faint); }

        .row-item { background: var(--vellum-2); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .var-grid { display: grid; grid-template-columns: 1fr 1fr 64px 1fr auto; gap: 8px; align-items: end; }
        .mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
        .scores-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .score-col { background: var(--vellum-2); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
        .score-col h6 { margin: 0 0 8px; font-size: 13px; text-align: center; font-weight: 600; }
        .score-col.rds h6 { color: var(--ink-sapphire); }
        .score-col.lvi h6 { color: var(--ink-amber); }
        .score-col.bcr h6 { color: var(--ink-ruby); }
        /* Formula drawer */
        .fx-open {
            min-width: 28px; min-height: 24px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--rule); border-radius: 6px; color: var(--text-dim);
            cursor: pointer; font-size: 14px; line-height: 1; flex-shrink: 0;
        }
        .fx-open:hover, .fx-open:focus-visible { border-color: var(--ink-amber); color: var(--ink-amber); }
        .fx-drawer { margin-top: 12px; border: 1px solid var(--ink-amber); border-radius: 10px; background: var(--inkwell); padding: 12px; }
        .fx-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .fx-title { font-size: 13px; font-weight: 600; color: var(--ink-amber); }
        .fx-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; min-width: 32px; min-height: 32px; line-height: 1; }
        .fx-close:hover { color: var(--text); }
        .fx-ta { font-size: 14px !important; }
        .fx-chip-group { margin-top: 10px; }
        .fx-chip-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 4px; }
        .fx-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 96px; overflow-y: auto; }
        .chip-btn {
            font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 3px 8px; border-radius: 999px;
            background: var(--vellum-2); border: 1px solid var(--rule); color: var(--ink-amethyst); cursor: pointer;
        }
        .chip-btn:hover, .chip-btn:focus-visible { border-color: var(--ink-amethyst); }
        .fx-result { font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--rule); min-height: 16px; word-break: break-word; }
        .fx-result.ok { color: var(--ink-emerald); }
        .fx-result.neutral { color: var(--text-faint); }
        .remove-btn {
            min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            background: transparent; border: 1px solid var(--ink-ruby); color: var(--ink-ruby); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .remove-btn:hover { background: var(--ink-ruby); color: #1A0508; }
        .add-btn { margin-top: 4px; }
        .editor-footer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); }

        /* Inspector tabs */
        .tabbar { display: flex; border-bottom: 1px solid var(--rule); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Inter', sans-serif; }
        .tab-btn[aria-selected="true"] { color: var(--ink-amber); border-bottom-color: var(--ink-amber); }
        .tab-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: none; }
        .tab-panel.active { display: block; }

        .search-wrap { position: relative; }
        #search-results { position: absolute; z-index: 30; width: 100%; margin-top: 4px; background: var(--vellum-2); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 300px; overflow-y: auto; }
        #search-results.hidden { display: none; }
        .search-item { padding: 8px 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--rule); }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: var(--rule); }
        .search-item img { width: 34px; height: 47px; border-radius: 4px; object-fit: cover; }

        /* Ink Ledger */
        .card-header { display: flex; gap: 12px; align-items: center; margin: 14px 0; }
        .card-header img { width: 54px; height: 75px; border-radius: 6px; object-fit: cover; }
        .card-header .cname { font-size: 22px; color: var(--text); }
        .card-header .cmeta { font-size: 12px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

        .ledger { border: 1px solid var(--rule); border-radius: 12px; padding: 14px; background: var(--inkwell); margin-bottom: 16px; }
        .ledger-title { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
        .meter { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
        .meter:last-child { margin-bottom: 0; }
        .meter-lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
        .meter-track { height: 8px; background: var(--vellum-2); border-radius: 999px; overflow: hidden; }
        .meter-fill { height: 100%; width: 0; border-radius: 999px; transition: width .2s ease-out; }
        .meter-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: right; position: relative; min-width: 56px; }
        .meter-delta { font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-left: 6px; opacity: 0; transition: opacity .2s; }
        .meter-delta.show { opacity: 1; }
        .rds .meter-lbl, .rds .meter-val { color: var(--ink-sapphire); }
        .lvi .meter-lbl, .lvi .meter-val { color: var(--ink-amber); }
        .bcr .meter-lbl, .bcr .meter-val { color: var(--ink-ruby); }
        .rds .meter-fill { background: var(--ink-sapphire); }
        .lvi .meter-fill { background: var(--ink-amber); }
        .bcr .meter-fill { background: var(--ink-ruby); }

        /* Analysis: image, stat tiles, card text, breakdown cards (CardThreatLevelInspector style) */
        .card-img-wrap { text-align: center; margin-bottom: 12px; }
        .card-img-wrap img { max-width: 260px; width: 100%; border-radius: 10px; border: 1px solid var(--rule); }
        .stat-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .stat-tile { border-radius: 12px; padding: 10px; text-align: center; border: 1px solid var(--rule); }
        .stat-tile .t-lbl { font-size: 12px; color: var(--text-dim); }
        .stat-tile .t-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; }
        .stat-tile.ctl { background: rgba(167,139,250,.12); } .stat-tile.ctl .t-val { color: var(--ink-amethyst); }
        .stat-tile.rds { background: rgba(89,167,242,.12); } .stat-tile.rds .t-val { color: var(--ink-sapphire); }
        .stat-tile.lvi { background: rgba(233,180,76,.12); } .stat-tile.lvi .t-val { color: var(--ink-amber); }
        .stat-tile.bcr { background: rgba(239,96,112,.12); } .stat-tile.bcr .t-val { color: var(--ink-ruby); }
        .ctext { background: var(--vellum-2); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-bottom: 16px; }
        .ctext-hl { font-weight: 600; cursor: pointer; border-bottom: 1px dotted currentColor; border-radius: 2px; }
        .ctext-hl:hover { filter: brightness(1.2); }
        .bd-card { background: var(--vellum-2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .bd-card .bd-contrib { font-size: 13px; margin: 4px 0 0; }
        .bd-card .bd-contrib .val { font-family: 'JetBrains Mono', monospace; }
        .bd-card .bd-expl { font-size: 12px; color: var(--text-faint); margin: 4px 0 0; }
        .bd-link { background: none; border: none; padding: 0; cursor: pointer; font: inherit; font-weight: 600; text-align: left; text-decoration: underline dotted; }
        .bd-link:hover { filter: brightness(1.2); }

        /* Highlights */
        .highlight { padding: 1px 3px; border-radius: 3px; font-weight: 600; background: var(--match-fill); color: var(--ink-emerald); }

        /* Regex tester */
        .tester-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
        .fmt-checks { display: flex; gap: 14px; margin: 12px 0; font-size: 13px; color: var(--text-dim); }
        .fmt-checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .fmt-checks input { width: 16px; height: 16px; accent-color: var(--ink-amber); }
        #custom-regex-error { color: var(--ink-ruby); font-size: 13px; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
        #custom-regex-error.hidden { display: none; }
        .stat-bar-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: center; margin-bottom: 5px; font-size: 12px; }
        .stat-bar-track { height: 10px; border-radius: 4px; background: var(--vellum-2); overflow: hidden; display: flex; }
        .stat-bar-seg { height: 100%; }
        .stat-num { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); white-space: nowrap; }
        .stat-block h4 { font-size: 13px; color: var(--text); font-weight: 600; margin: 12px 0 8px; }
        .rr-card { display: flex; gap: 12px; padding: 10px; background: var(--vellum); border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .rr-card:hover { background: var(--vellum-2); }
        .rr-card img { width: 56px; height: 78px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .rr-name { font-weight: 600; color: var(--ink-sapphire); margin-bottom: 4px; }
        .rr-chips { display: flex; flex-wrap: wrap; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-bottom: 6px; }
        .rr-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

        /* Empty states */
        .empty { text-align: center; color: var(--text-faint); padding: 40px 20px; border: 2px dashed var(--rule); border-radius: 12px; }
        .empty p { margin: 4px 0; }

        /* Banner */
        #warning-banner, #draft-banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; padding: 10px 16px; text-align: center; flex-shrink: 0; }
        #warning-banner { background: rgba(233,180,76,.12); border-bottom: 1px solid var(--ink-amber); color: var(--ink-amber); }
        #draft-banner { background: rgba(89,167,242,.12); border-bottom: 1px solid var(--ink-sapphire); color: var(--ink-sapphire); }
        .hidden { display: none !important; }

        /* Loader */
        #loader { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: var(--inkwell); color: var(--text-dim); }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--rule); border-top-color: var(--ink-amber); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        #toast-host { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: 92vw; }
        .toast { background: var(--vellum-2); border: 1px solid var(--rule); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: flex; align-items: center; gap: 12px; }
        .toast button { background: none; border: none; color: var(--ink-amber); font-weight: 600; cursor: pointer; font: inherit; }

        /* focus highlight animation on pattern rows */
        @keyframes focus-highlight { from { background-color: rgba(233,180,76,.25); } to { background-color: transparent; } }
        .focus-animation { animation: focus-highlight 1.5s ease-out; }

        /* Mobile tab bar + sheet */
        #mobile-tabs { display: none; }
        #cat-sheet-backdrop { display: none; }

        @media (max-width: 1023px) {
            #panels { display: block; position: relative; }
            #center, #inspector { display: none; height: 100%; }
            #panels[data-mtab="patterns"] #center { display: flex; }
            #panels[data-mtab="analyze"] #inspector { display: flex; }
            #panels[data-mtab="tester"] #inspector { display: flex; }
            #inspector { border-left: none; }

            #rail {
                position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 60;
                max-height: 70vh; border: 1px solid var(--rule); border-radius: 16px 16px 0 0;
                transform: translateY(105%); transition: transform .2s ease-out; border-right: none;
            }
            #rail.open { transform: none; }
            #cat-sheet-backdrop.open { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.5); }
            #cat-sheet-btn { display: inline-flex; }

            #mobile-tabs {
                display: flex; flex-shrink: 0; border-top: 1px solid var(--rule); background: var(--vellum);
                padding-bottom: env(safe-area-inset-bottom, 0);
            }
            .mtab { flex: 1; min-height: 56px; background: transparent; border: none; color: var(--text-dim); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
            .mtab[aria-selected="true"] { color: var(--ink-amber); }
            .mtab[aria-selected="true"] .mtab-ico { color: var(--ink-amber); }

            #app-bar .meta { display: none; }
            #app-bar .title { font-size: 18px; }

            .var-grid { grid-template-columns: 1fr 1fr; }
            .var-grid .remove-btn { grid-column: 1 / -1; width: 100%; }
            .scores-grid { grid-template-columns: 1fr; }
            .icon-btn, .remove-btn { min-width: 44px; min-height: 44px; }
        }
        @media (min-width: 1024px) { .desktop-hidden { display: none !important; } }
        @media (max-width: 1023px) { .mobile-hidden { display: none !important; } }

        @media (prefers-reduced-motion: reduce) {
            *, .meter-fill, .chev, .prow, .btn { transition: none !important; animation: none !important; }
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
        <span>Loading card database...</span>
    </div>

    <div id="app-frame">
        <header id="app-bar">
            <div>
                <div class="title display"><span class="quill">&#9998;</span> Lorcana Ability Editor</div>
                <div class="meta" id="meta-line">loading...</div>
            </div>
            <div class="bar-actions">
                <label for="json-file-input" class="btn btn-secondary" tabindex="0" role="button">Load JSON</label>
                <input type="file" id="json-file-input" class="hidden" accept=".json">
                <button id="save-json-btn" class="btn btn-secondary" title="Save (Ctrl/Cmd+S)">Save <span class="save-dot hidden" id="save-dot">&#9679;</span></button>
                <button id="new-ability-btn" class="btn btn-primary">+ New Ability</button>
            </div>
        </header>

        <div id="warning-banner" class="hidden"></div>
        <div id="draft-banner" class="hidden"></div>

        <div id="panels" data-mtab="patterns">
            <!-- Left rail: category tree -->
            <aside id="rail" aria-label="Categories">
                <h2 class="rail-title">Categories</h2>
                <div id="tree-nav"><div class="empty" style="padding:20px">Load abilities to build navigation.</div></div>
            </aside>

            <!-- Center: pattern workspace -->
            <section id="center">
                <div class="filter-bar">
                    <div class="filter-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
                        <input type="text" id="pattern-filter-input" class="inp" placeholder="Filter abilities (name, regex, explanation)...">
                    </div>
                    <button id="cat-sheet-btn" class="icon-btn" aria-label="Categories">&#9776;</button>
                </div>
                <div id="active-filter-chip" class="active-filter-chip"><span id="active-filter-label"></span><button id="clear-tree-filter" aria-label="Clear category filter">&times;</button></div>
                <div id="pattern-list">
                    <div class="empty"><p>No abilities loaded.</p><p>Load a JSON file or wait for auto-load.</p></div>

            <!-- Right: inspector -->
            <section id="inspector">
                <div class="tabbar" role="tablist">

                    <button class="tab-btn" id="tab-tester" role="tab" aria-selected="false" aria-controls="panel-tester">Regex Tester</button>

                <div id="panel-analysis" class="tab-panel active" role="tabpanel" aria-labelledby="tab-analysis">
                    <div class="search-wrap">
                        <input type="text" id="search-input" class="inp" placeholder="Search for a card (e.g. 'Elsa', 'Be Prepared')">
