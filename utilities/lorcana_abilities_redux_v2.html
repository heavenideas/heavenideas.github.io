                    </div>
                    <div id="card-details">
                        <div class="empty" style="margin-top:16px"><p>Search for a card to see how the loaded patterns score it.</p><p>Edits update this analysis live.</p></div>
                    </div>
                </div>

                <div id="panel-tester" class="tab-panel" role="tabpanel" aria-labelledby="tab-tester">
                    <div class="tester-controls">
                        <div class="fld" style="flex:1 1 160px">
                            <label class="lbl" for="custom-regex-input">Regex Pattern</label>
                            <input type="text" id="custom-regex-input" class="inp mono" placeholder="e.g. draw \d+ cards">
                        </div>
                        <div class="fld" style="width:88px">
                            <label class="lbl" for="custom-regex-flags">Flags</label>
                            <input type="text" id="custom-regex-flags" class="inp mono" value="gi" placeholder="gi">
                        </div>
                        <button id="custom-regex-btn" class="btn btn-primary">Search</button>
                        <button id="copy-results-btn" class="btn btn-secondary hidden">Copy Names</button>
                    </div>
                    <div class="fmt-checks">
                        <label title="Unchecked: only cards legal in Core Constructed. Checked: only cards legal in Infinity."><input type="checkbox" id="format-filter-infinity"> Infinity <span style="color:var(--text-faint)">(off = Core)</span></label>
                    </div>
                    <div id="custom-regex-error" class="hidden"></div>
                    <div id="custom-regex-stats" class="stat-block"></div>
                    <div id="custom-regex-results"></div>
                </div>
            </section>
        </div>

        <nav id="mobile-tabs" role="tablist" aria-label="Panels">
            <button class="mtab" data-mtab="patterns" aria-selected="true"><span class="mtab-ico">&#9998;</span>Patterns</button>
            <button class="mtab" data-mtab="analyze" aria-selected="false"><span class="mtab-ico">&#9635;</span>Analyze</button>
            <button class="mtab" data-mtab="tester" aria-selected="false"><span class="mtab-ico">&#8623;</span>Tester</button>
        </nav>
    </div>

    <div id="cat-sheet-backdrop"></div>
    <div id="toast-host"></div>

    <!-- Field datalists -->
    <datalist id="dl-type"><option value="numeric"><option value="textOrNumber"></datalist>
    <datalist id="dl-operation"><option value="multiply"><option value="add"><option value="set"></datalist>
    <datalist id="dl-targetMetric"><option value="lvi"><option value="bcr"><option value="rds"></datalist>
    <datalist id="dl-source"><option value="regex"><option value="card.cost"><option value="card.strength"><option value="card.willpower"><option value="card.lore"></datalist>
    <datalist id="dl-category"></datalist>
    <datalist id="dl-subtype"></datalist>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- GLOBAL STATE ---
        let allCards = [];
        let cardFlatTexts = [];            // parallel to allCards, flattened text (for badges/tester)
        let ABILITIES_CONFIG = { '@constants': {}, abilities: [] };
        let fuse;
        let selectedCard = null;
        let lastRegexResults = [];

        const openSet = new Set();         // ability objects currently expanded (identity-tracked, NOT serialized)
        const matchCount = new Map();      // ability -> number | null (side map, NOT serialized)
        let selectedMatchSet = new Set();  // abilities matching selectedCard
        let activeFilter = { type: 'all' };
        let isDirty = false;
        let lastLedger = null;             // {card, rds, lvi, bcr}

        const DB_URL = 'https://raw.githubusercontent.com/heavenideas/similcana/refs/heads/main/database/allCards.json';
        const ABILITIES_URL = 'https://raw.githubusercontent.com/heavenideas/heavenideas.github.io/refs/heads/main/lorcanaUtils_MatchUpAnalyzer/lorcana_abilities_redux.json';
        const DRAFT_KEY = 'lorcana_abilities_redux_v2_draft';

        const INK_COLORS = { Amber: '#E9B44C', Amethyst: '#A78BFA', Emerald: '#4CC38A', Ruby: '#EF6070', Sapphire: '#59A7F2', Steel: '#94A3B8' };
        const INK_ORDER = ["Amber","Amethyst","Emerald","Ruby","Sapphire","Steel",
            "Amber-Steel","Amber-Sapphire","Amber-Emerald","Amber-Ruby","Amber-Amethyst",
            "Amethyst-Steel","Amethyst-Ruby","Amethyst-Emerald","Amethyst-Sapphire",
            "Emerald-Ruby","Emerald-Sapphire","Emerald-Steel",
            "Ruby-Steel","Ruby-Sapphire","Sapphire-Steel"];
        const TYPE_ORDER = ['Character', 'Item', 'Action', 'Location', 'Song'];

        // --- UI ELEMENTS ---
        const $ = id => document.getElementById(id);
        const loader = $('loader');
        const warningBanner = $('warning-banner');
        const draftBanner = $('draft-banner');
        const jsonFileInput = $('json-file-input');
        const saveJsonBtn = $('save-json-btn');
        const saveDot = $('save-dot');
        const newAbilityBtn = $('new-ability-btn');
        const patternListContainer = $('pattern-list');
        const cardDetailsContainer = $('card-details');
        const searchInput = $('search-input');
        const searchResultsContainer = $('search-results');
        const treeNavContainer = $('tree-nav');
        const metaLine = $('meta-line');
        const patternFilterInput = $('pattern-filter-input');
        const customRegexInput = $('custom-regex-input');
        const customRegexFlags = $('custom-regex-flags');
        const customRegexBtn = $('custom-regex-btn');
        const customRegexResults = $('custom-regex-results');
        const customRegexError = $('custom-regex-error');
        const customRegexStats = $('custom-regex-stats');
        const copyResultsBtn = $('copy-results-btn');
        const panels = $('panels');
        const rail = $('rail');
        const catSheetBtn = $('cat-sheet-btn');
        const catSheetBackdrop = $('cat-sheet-backdrop');
        const activeFilterChip = $('active-filter-chip');
        const activeFilterLabel = $('active-filter-label');

        // --- UTIL ---
        function esc(s) {
            if (s === undefined || s === null) return '';
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }
        function debounce(fn, ms) {
            let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
        }
        function toast(message, opts = {}) {
            const host = $('toast-host');
            const el = document.createElement('div');
            el.className = 'toast';
            const span = document.createElement('span');
            span.textContent = message;
            el.appendChild(span);
            let timer;
            const dismiss = () => { clearTimeout(timer); el.remove(); };
            if (opts.action) {
                const btn = document.createElement('button');
                btn.textContent = opts.action;
                btn.addEventListener('click', () => { opts.onAction && opts.onAction(); dismiss(); });
                el.appendChild(btn);
            }
            host.appendChild(el);
            timer = setTimeout(dismiss, opts.duration || 4000);
        }

        // --- DIRTY STATE / DRAFT ---
        function markDirty() {
            if (!isDirty) { isDirty = true; saveDot.classList.remove('hidden'); saveJsonBtn.title = 'Unsaved changes'; }
            scheduleDraftSave();
        }
        function clearDirty() {
            isDirty = false; saveDot.classList.add('hidden'); saveJsonBtn.title = 'Save (Ctrl/Cmd+S)';
        }
        const scheduleDraftSave = debounce(() => {
            try {
                const clone = JSON.parse(JSON.stringify(ABILITIES_CONFIG));
                (clone.abilities || []).forEach(p => delete p.regexObject);
                localStorage.setItem(DRAFT_KEY, JSON.stringify({ ts: Date.now(), config: clone }));
            } catch (e) { /* storage may be unavailable */ }
        }, 2000);
        function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
        window.addEventListener('beforeunload', (e) => { if (isDirty) { e.preventDefault(); e.returnValue = ''; } });

        // --- DATA-DRIVEN CALCULATION ENGINE (ported verbatim) ---
        function getNumberFromText(text) {
            if (typeof text === 'number') return text;
            if (!text || typeof text !== 'string') return 0;
            const lowerText = text.toLowerCase().trim();
            const wordMap = { 'a': 1, 'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'ten': 10 };
            if (wordMap[lowerText] !== undefined) { return wordMap[lowerText]; }
            const match = lowerText.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
        }

        function evaluateFormula(formula, context) {
            if (typeof formula !== 'string') return formula;

            let processedFormula = formula.replace(/@([\w.\[\]]+)/g, (_, path) => {
                const parts = path.split('.');
                let current = context;
                for (const part of parts) {
                    if (current === undefined || current === null) return 0;
                    const arrayMatch = part.match(/(\w+)\[(\w+)\]/);
                    if (arrayMatch) {
                        const arrayName = arrayMatch[1];
                        const keyName = arrayMatch[2];
                        const key = context[keyName];
                        current = current[arrayName] ? current[arrayName][key] : undefined;
                    } else {
                        current = current[part];
                    }
                }
                return (typeof current === 'number') ? current : (typeof current === 'string' ? `'${current}'` : 0);
            });

            processedFormula = processedFormula.replace(/[a-zA-Z_]\w*/g, (match) => {
                if (context[match] !== undefined && typeof context[match] === 'number') {
                    return context[match];
                }
                return match;
            });

            try {
                return new Function(`return ${processedFormula}`)();
            } catch (e) {
                console.error(`Error evaluating formula: "${formula}" -> "${processedFormula}"`, e);
                return 0;
            }
        }

        function calculateCardMetrics(card) {
            if (!ABILITIES_CONFIG || !ABILITIES_CONFIG.abilities) {
                return { rds: 0, lvi: 0, bcr: 0, breakdown: [] };
            }

            const fullText = (card.fullTextSections || []).join(' ').replace(/\n/g, ' ');
            const cardContext = {
                card: card,
                ...ABILITIES_CONFIG['@constants'],
                context: {
                    lvi: { survivability: 1.0, questSafety: 1.0 },
                    bcr: {},
                    rds: {}
                }
            };

            const matchedAbilities = [];
            ABILITIES_CONFIG.abilities.forEach(abilityDef => {
                if (abilityDef.regex === "WILL_NOT_MATCH_TEXT") {
                    matchedAbilities.push({ def: abilityDef, match: null });
                    return;
                }
                if (!abilityDef.regexObject) return;
                abilityDef.regexObject.lastIndex = 0;
                const match = abilityDef.regexObject.exec(fullText);
                if (match) {
                    matchedAbilities.push({ def: abilityDef, match });
                }
            });

            matchedAbilities.forEach(({ def, match }) => {
                (def.calculation.variables || []).forEach(variableDef => {
                    let value;
                    if (variableDef.source === 'regex' && match) {
                        value = match[variableDef.group];
                    } else if (variableDef.source && variableDef.source.startsWith('card.')) {
                        const propName = variableDef.source.substring(5);
                        value = card[propName];
                    }

                    if (variableDef.type === 'textOrNumber') {
                        cardContext[variableDef.name] = getNumberFromText(value);
                    } else if (variableDef.type === 'numeric') {
                        cardContext[variableDef.name] = parseInt(value, 10) || 0;
                    } else {
                        cardContext[variableDef.name] = value;
                    }
                });
            });

            matchedAbilities.forEach(({ def }) => {
                (def.calculation.contextModifiers || []).forEach(modDef => {
                    let shouldApply = modDef.condition ? evaluateFormula(modDef.condition, cardContext) : true;
                    if (shouldApply) {
                        const value = evaluateFormula(modDef.value, cardContext);
                        const metricContext = cardContext.context[modDef.targetMetric];
                        if (metricContext) {
                            if (modDef.operation === 'multiply') {
                                metricContext[modDef.name] = (metricContext[modDef.name] || 1.0) * value;
                            } else if (modDef.operation === 'add') {
                                metricContext[modDef.name] = (metricContext[modDef.name] || 0) + value;
                            } else if (modDef.operation === 'set') {
                                metricContext[modDef.name] = value;
                            }
                        }
                    }
                });
            });

            let rds = 0, lvi = 0, bcr = 0;
            const breakdown = [];

            matchedAbilities.forEach(({ def }) => {
                const scores = def.calculation.scores || {};
                for (const [metric, scoreDef] of Object.entries(scores)) {
                    let shouldApply = scoreDef.condition ? evaluateFormula(scoreDef.condition, cardContext) : true;
                    if (shouldApply) {
                        const rawValue = evaluateFormula(scoreDef.value, cardContext);
                        const inkCost = card.cost > 0 ? card.cost : 1;
                        const finalValue = rawValue / inkCost;

                        const explanation = scoreDef.explanation || def.name;
                        breakdown.push({
                            abilityName: def.name,
                            metric: metric,
                            value: finalValue,
                            explanation: `${explanation} (Raw: ${rawValue.toFixed(2)} / Cost: ${inkCost} = ${finalValue.toFixed(2)})`
                        });

                        if (metric === 'resource_dominance') rds += finalValue;
                        if (metric === 'lore_velocity') lvi += finalValue;
                        if (metric === 'board_control') bcr += finalValue;
                    }
                }
            });

            return { rds, lvi, bcr, breakdown };
        }

        // Regex compile routine (verbatim semantics: /pattern/flags -> RegExp, bare -> gi)
        function compileRegex(str) {
            const m = str.match(/^\/(.*)\/([gimuy]*)$/);
            return m ? new RegExp(m[1], m[2]) : new RegExp(str, 'gi');
        }

        // --- INITIALIZATION ---
        async function initializeApp() {
            metaLine.textContent = 'loading...';
            try {
                await loadAbilitiesFromUrl();
                const cardsResponse = await fetch(DB_URL);
                if (!cardsResponse.ok) throw new Error(`Network response for cards was not ok: ${cardsResponse.statusText}`);
                const cardsData = await cardsResponse.json();
                allCards = cardsData.cards;
                cardFlatTexts = allCards.map(c => (c.fullText || (c.fullTextSections || []).join(' ')).replace(/\n/g, ' ').trim());
                setupFuseSearch();
                loader.classList.add('hidden');
                computeAllMatchCounts();
                checkDraft();
            } catch (error) {
                loader.innerHTML = `<div style="color:var(--ink-ruby);font-weight:600">Failed to load card database. Try refreshing.</div><div style="color:var(--text-faint);font-size:13px;margin-top:6px">${esc(error.message)}</div>`;
            }
        }

        function setupFuseSearch() {
            const options = { includeScore: true, keys: ['fullName', 'simpleName'], threshold: 0.3 };
            fuse = new Fuse(allCards, options);
        }

        // --- ABILITY DATA HANDLING ---
        async function loadAbilitiesFromUrl() {
            try {
                const response = await fetch(ABILITIES_URL);
                if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                const data = await response.json();
                processLoadedAbilities(data, `From URL at ${new Date().toLocaleTimeString()}`);
            } catch (error) {
                console.error("Failed to load abilities from URL:", error);
                warningBanner.innerHTML = `<span><strong>Could not auto-load abilities from the web.</strong> Load the file manually.</span>`;
                const b = document.createElement('label');
                b.className = 'btn btn-primary'; b.textContent = 'Load file'; b.setAttribute('for', 'json-file-input');
                warningBanner.appendChild(b);
                warningBanner.classList.remove('hidden');
            }
        }

        function processLoadedAbilities(data, timestampMessage) {
            try {
                ABILITIES_CONFIG = data;
                if (!ABILITIES_CONFIG.abilities) ABILITIES_CONFIG.abilities = [];

                ABILITIES_CONFIG.abilities.forEach(p => {
                    if (p.regex && p.regex !== "WILL_NOT_MATCH_TEXT") {
                        try {
                            p.regexObject = compileRegex(p.regex);
                        } catch (e) {
                            console.error(`Invalid regex for pattern "${p.name}": ${p.regex}`);
                            p.regexObject = null;
                        }
                    }
                });

                openSet.clear();
                matchCount.clear();
                activeFilter = { type: 'all' };
                rebuildFieldDatalists();
                buildAndRenderTree();
                renderPatternList();
                metaLine.textContent = `${timestampMessage} · ${ABILITIES_CONFIG.abilities.length} abilities`;
                selectedMatchSet = selectedCard ? getMatchedPatterns(selectedCard) : new Set();
                if (selectedCard) displayCardDetails(selectedCard, false);
                warningBanner.classList.add('hidden');
                clearDirty();
                if (cardFlatTexts.length) computeAllMatchCounts();
            } catch (err) {
                toast('Error processing ability patterns: ' + err.message);
            }
        }

        function checkDraft() {
            let draft;
            try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return; }
            if (!draft || !draft.config) return;
            draftBanner.innerHTML = '';
            const span = document.createElement('span');
            span.textContent = `Restore unsaved draft from ${new Date(draft.ts).toLocaleString()}?`;
            const restore = document.createElement('button');
            restore.className = 'btn btn-primary'; restore.textContent = 'Restore';
            restore.addEventListener('click', () => {
                processLoadedAbilities(draft.config, `Restored draft at ${new Date().toLocaleTimeString()}`);
                markDirty();
                draftBanner.classList.add('hidden');
            });
            const discard = document.createElement('button');
            discard.className = 'btn btn-secondary'; discard.textContent = 'Discard';
            discard.addEventListener('click', () => { clearDraft(); draftBanner.classList.add('hidden'); });
            draftBanner.appendChild(span); draftBanner.appendChild(restore); draftBanner.appendChild(discard);
            draftBanner.classList.remove('hidden');
        }

        function rebuildFieldDatalists() {
            const cats = new Set(), subs = new Set();
            ABILITIES_CONFIG.abilities.forEach(p => { if (p.category) cats.add(p.category); if (p.sub_type) subs.add(p.sub_type); });
            const fill = (id, arr) => { $(id).innerHTML = arr.sort().map(v => `<option value="${esc(v)}">`).join(''); };
            fill('dl-category', [...cats]);
            fill('dl-subtype', [...subs]);
        }

        // --- MATCH COUNT BADGES ---
        function countForPattern(p) {
            if (!p.regexObject || p.regex === 'WILL_NOT_MATCH_TEXT') return null;
            let c = 0; const re = p.regexObject;
            for (let i = 0; i < cardFlatTexts.length; i++) {
                re.lastIndex = 0;
                if (cardFlatTexts[i] && re.test(cardFlatTexts[i])) c++;
            }
            return c;
        }
        let matchCountRun = 0;
        function scheduleIdle(cb) {
            // NOTE: must call requestIdleCallback bound to window; extracting it throws "Illegal invocation"
            if (window.requestIdleCallback) window.requestIdleCallback(cb);
            else setTimeout(cb, 1);
        }
        function computeAllMatchCounts() {
            const run = ++matchCountRun;
            const abilities = ABILITIES_CONFIG.abilities.slice();
            let i = 0;
            const step = () => {
                if (run !== matchCountRun) return; // superseded by a newer run
                const end = Math.min(i + 10, abilities.length);
                for (; i < end; i++) {
                    const p = abilities[i];
                    matchCount.set(p, countForPattern(p));
                    refreshRowBadge(p);
                    if (openSet.has(p)) { const row = rowElFor(p); if (row) updateRegexStatus(row, p); }
                }
                if (i < abilities.length) scheduleIdle(step);
            };
            step();
        }
        const recomputeTimers = new Map(); // per-pattern debounce timers
        function recomputeOneCount(p) {
            clearTimeout(recomputeTimers.get(p));
            recomputeTimers.set(p, setTimeout(() => {
                recomputeTimers.delete(p);
                matchCount.set(p, countForPattern(p));
                refreshRowBadge(p);
                const row = rowElFor(p);
                if (row) updateRegexStatus(row, p);
            }, 400));
        }

        // --- PATTERN WORKSPACE ---
        function rowElFor(pattern) {
            const idx = ABILITIES_CONFIG.abilities.indexOf(pattern);
            if (idx < 0) return null;
            return patternListContainer.querySelector(`.prow[data-index="${idx}"]`);
        }

        // form field helper (input + optional datalist, always escaped)
        function field(label, attrs, value, placeholder = '', opts = {}) {
            const cls = opts.cls || '';
            const monoCls = opts.mono ? ' mono' : '';
            const listAttr = opts.list ? ` list="${opts.list}"` : '';
            const labelHtml = opts.fxPath
                ? `<div class="lbl-row"><label class="lbl" style="margin-bottom:0">${esc(label)}</label><button type="button" class="fx-open" data-fx-path="${esc(opts.fxPath)}" data-fx-label="${esc(opts.fxLabel || label)}" title="Open formula editor" aria-label="Open formula editor for ${esc(label)}">&#x2922;</button></div>`
                : `<label class="lbl">${esc(label)}</label>`;
            if (opts.textarea) {
                return `<div class="fld ${cls}">${labelHtml}<textarea class="inp ta${monoCls}" ${attrs} placeholder="${esc(placeholder)}" rows="${opts.rows || 2}">${esc(value)}</textarea></div>`;
            }
            return `<div class="fld ${cls}">${labelHtml}<input type="text" class="inp${monoCls}" ${attrs}${listAttr} placeholder="${esc(placeholder)}" value="${esc(value)}"></div>`;
        }

        // Path helpers (read side; write side keeps the exact original setter semantics)
        function pathKeys(path) { return path.match(/(\w+)|\[(\d+)\]/g).map(k => k.replace(/\[|\]/g, '')); }
        function getByPath(obj, path) {
            let cur = obj;
            for (const k of pathKeys(path)) { if (cur === undefined || cur === null) return undefined; cur = cur[k]; }
            return cur;
        }
        function flattenLeafPaths(obj, prefix = '') {
            const out = [];
            for (const [k, v] of Object.entries(obj || {})) {
                const p = prefix ? `${prefix}.${k}` : k;
                if (v && typeof v === 'object' && !Array.isArray(v)) out.push(...flattenLeafPaths(v, p));
                else out.push(p);
            }
            return out;
        }

        function variablesHTML(pattern) {
            return (pattern.calculation?.variables || []).map((v, i) => `
                <div class="row-item" data-variable-index="${i}">
                    <div class="var-grid">
                        ${field('Name', `data-path="calculation.variables[${i}].name"`, v.name, 'drawCount')}
                        ${field('Source', `data-path="calculation.variables[${i}].source"`, v.source, 'regex', { list: 'dl-source', mono: true })}
                        ${field('Group', `data-path="calculation.variables[${i}].group"`, v.group, '1', { mono: true })}
                        ${field('Type', `data-path="calculation.variables[${i}].type"`, v.type, 'textOrNumber', { list: 'dl-type' })}
                        <button class="remove-btn" data-action="remove-variable" data-index="${i}" aria-label="Remove variable">&times; Remove</button>
                    </div>
                </div>`).join('');
        }
        function modifiersHTML(pattern) {
            return (pattern.calculation?.contextModifiers || []).map((m, i) => `
                <div class="row-item" data-modifier-index="${i}">
                    <div class="mod-grid">
                        ${field('Target Metric', `data-path="calculation.contextModifiers[${i}].targetMetric"`, m.targetMetric, 'lvi', { list: 'dl-targetMetric', mono: true })}
                        ${field('Name', `data-path="calculation.contextModifiers[${i}].name"`, m.name, 'survivability')}
                        ${field('Operation', `data-path="calculation.contextModifiers[${i}].operation"`, m.operation, 'multiply', { list: 'dl-operation' })}
                        ${field('Value', `data-path="calculation.contextModifiers[${i}].value"`, m.value, '@constants.lvi.wardModifier', { mono: true, textarea: true, rows: 1, fxPath: `calculation.contextModifiers[${i}].value`, fxLabel: `Modifier ${i + 1} · Value` })}
                        ${field('Condition (Optional)', `data-path="calculation.contextModifiers[${i}].condition"`, m.condition, '@card.willpower > 5', { mono: true, cls: 'mod-cond', textarea: true, rows: 1, fxPath: `calculation.contextModifiers[${i}].condition`, fxLabel: `Modifier ${i + 1} · Condition` })}
                    </div>
                    <div style="margin-top:8px"><button class="remove-btn" data-action="remove-modifier" data-index="${i}" aria-label="Remove modifier">&times; Remove</button></div>
                </div>`).join('');
        }
        const SCORE_META = { resource_dominance: { cls: 'rds', label: 'Resource Dominance' }, lore_velocity: { cls: 'lvi', label: 'Lore Velocity' }, board_control: { cls: 'bcr', label: 'Board Control' } };
        function scoresHTML(pattern) {
            return Object.keys(SCORE_META).map(metric => {
                const meta = SCORE_META[metric];
                const s = pattern.calculation?.scores?.[metric] || {};
                return `<div class="score-col ${meta.cls}"><h6>${meta.label}</h6>
                    ${field('Value', `data-path="calculation.scores.${metric}.value"`, s.value, 'baseLore * @context...', { mono: true, textarea: true, rows: 1, fxPath: `calculation.scores.${metric}.value`, fxLabel: `${meta.label} · Value` })}
                    ${field('Explanation', `data-path="calculation.scores.${metric}.explanation"`, s.explanation)}
                    ${field('Condition', `data-path="calculation.scores.${metric}.condition"`, s.condition, '@card.willpower > 5', { mono: true, textarea: true, rows: 1, fxPath: `calculation.scores.${metric}.condition`, fxLabel: `${meta.label} · Condition` })}
                </div>`;
            }).join('');
        }

        function editorHTML(pattern) {
            return `
                <div class="stack">
                    ${field('Name', 'data-field="name"', pattern.name, 'Ability name')}
                    <div class="grid2">
                        ${field('Category', 'data-field="category"', pattern.category, 'Removal', { list: 'dl-category' })}
                        ${field('Sub-type', 'data-field="sub_type"', pattern.sub_type, 'Banish', { list: 'dl-subtype' })}
                    </div>
                    <div class="fld">
                        <div class="lbl-row">
                            <label class="lbl" style="margin-bottom:0">Regex</label>
                            <button class="btn btn-secondary btn-sm" data-action="test-search" title="Copy this regex into the Regex Tester and run it">Test in card search &rarr;</button>
                        </div>
                        <input type="text" class="inp mono" data-field="regex" placeholder="/Draw (\\d+) cards/gi or WILL_NOT_MATCH_TEXT" value="${esc(pattern.regex)}">
                        <div class="rgx-status" data-rgx-status></div>
                    </div>
                    ${field('Explanation', 'data-field="explanation"', pattern.explanation, '', { textarea: true })}
                    ${field('Justification', 'data-field="justification"', pattern.justification, '', { textarea: true })}
                </div>

                <div class="calc-section">
                    <h4 class="calc-head">Calculation</h4>
                    <div>
                        <div class="sub-head">Variables</div>
                        <div class="variables-container">${variablesHTML(pattern)}</div>
                        <button class="btn btn-secondary add-btn" data-action="add-variable">+ Add Variable</button>
                    </div>
                    <div>
                        <div class="sub-head">Context Modifiers</div>
                        <div class="modifiers-container">${modifiersHTML(pattern)}</div>
                        <button class="btn btn-secondary add-btn" data-action="add-modifier">+ Add Modifier</button>
                    </div>
                    <div>
                        <div class="sub-head">Scores</div>
                        <div class="scores-grid">${scoresHTML(pattern)}</div>
                    </div>
                    <div class="fx-drawer hidden" data-fx-drawer></div>
                </div>

                <div class="editor-footer">
                    <button class="btn btn-secondary" data-action="duplicate">Duplicate</button>
                    <button class="btn btn-danger" data-action="delete">Delete</button>
                </div>`;
        }

        function headerHTML(pattern) {
            const chip = [pattern.category || 'Uncategorized', pattern.sub_type].filter(Boolean).join(' · ');
            return `
                <span class="chev">&#9654;</span>
                <span class="prow-name">${esc(pattern.name || 'Unnamed')}</span>
                <span class="chip">${esc(chip)}</span>
                <span class="prow-regex mono">${esc(pattern.regex)}</span>
                <span class="badge" data-badge>&ndash;</span>
                <span class="dot invalid hidden" data-invalid></span>
                <span class="dot match-sel hidden" data-matchsel></span>`;
        }

        function getVisibleList() {
            let list = ABILITIES_CONFIG.abilities;
            if (activeFilter.type === 'category') {
                list = list.filter(p => (p.category || 'Uncategorized') === activeFilter.value);
            } else if (activeFilter.type === 'subtype') {
                list = list.filter(p => (p.category || 'Uncategorized') === activeFilter.category && (p.sub_type || 'General') === activeFilter.subType);
            }
            const q = patternFilterInput.value.trim().toLowerCase();
            if (q) {
                list = list.filter(p =>
                    (p.name || '').toLowerCase().includes(q) ||
                    (p.regex || '').toLowerCase().includes(q) ||
                    (p.explanation || '').toLowerCase().includes(q));
            }
            return list;
        }

        function renderPatternList() {
            const abilities = ABILITIES_CONFIG.abilities;
            if (!abilities.length) {
                patternListContainer.innerHTML = `<div class="empty"><p>No abilities loaded.</p><p>Load a JSON file or wait for auto-load.</p></div>`;
                return;
            }
            const list = getVisibleList();
            if (!list.length) {
                const q = patternFilterInput.value.trim();
                patternListContainer.innerHTML = `<div class="empty"><p>No abilities match ${q ? `'${esc(q)}'` : 'this filter'}.</p><button class="btn btn-secondary" id="clear-all-filters">Clear filter</button></div>`;
                const b = $('clear-all-filters');
                if (b) b.addEventListener('click', () => { patternFilterInput.value = ''; activeFilter = { type: 'all' }; buildAndRenderTree(); renderPatternList(); updateActiveFilterChip(); });
                return;
            }
            const frag = document.createDocumentFragment();
            list.forEach(pattern => {
                const idx = abilities.indexOf(pattern);
                const isOpen = openSet.has(pattern);
                const row = document.createElement('div');
                row.className = 'prow' + (isOpen ? ' open' : '');
                row.setAttribute('data-index', idx);
                row.innerHTML = `<button class="prow-head" data-toggle aria-expanded="${isOpen}">${headerHTML(pattern)}</button>
                    <div class="prow-body${isOpen ? '' : ' hidden'}">${isOpen ? editorHTML(pattern) : ''}</div>`;
                frag.appendChild(row);
            });
            patternListContainer.innerHTML = '';
            patternListContainer.appendChild(frag);
            // post-render: badges, dots, textareas, regex status
            list.forEach(pattern => {
                refreshRowBadge(pattern);
                refreshRowDots(pattern);
                if (openSet.has(pattern)) {
                    const row = rowElFor(pattern);
                    if (row) { updateRegexStatus(row, pattern); autoGrowAll(row); }
                }
            });
        }

        function autoGrow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; }
        function autoGrowAll(scope) { scope.querySelectorAll('textarea.ta').forEach(autoGrow); }

        function refreshRowBadge(pattern) {
            const row = rowElFor(pattern);
            if (!row) return;
            const badge = row.querySelector('[data-badge]');
            if (!badge) return;
            const invalid = isRegexInvalid(pattern);
            if (invalid) { badge.textContent = '—'; badge.className = 'badge bad'; return; }
            const c = matchCount.get(pattern);
            if (c === undefined) { badge.textContent = '–'; badge.className = 'badge'; return; }
            if (c === null) { badge.textContent = '—'; badge.className = 'badge zero'; return; }
            badge.textContent = String(c);
            badge.className = 'badge ' + (c > 0 ? 'pos' : 'zero');
        }
        function refreshRowDots(pattern) {
            const row = rowElFor(pattern);
            if (!row) return;
            const inv = row.querySelector('[data-invalid]');
            const ms = row.querySelector('[data-matchsel]');
            if (inv) inv.classList.toggle('hidden', !isRegexInvalid(pattern));
            if (ms) ms.classList.toggle('hidden', !selectedMatchSet.has(pattern));
        }
        function isRegexInvalid(pattern) {
            if (!pattern.regex || pattern.regex === 'WILL_NOT_MATCH_TEXT') return false;
            try { compileRegex(pattern.regex); return false; } catch (e) { return true; }
        }
        function updateRegexStatus(row, pattern) {
            const el = row.querySelector('[data-rgx-status]');
            if (!el) return;
            if (pattern.regex === 'WILL_NOT_MATCH_TEXT') { el.className = 'rgx-status neutral'; el.textContent = 'sentinel · will not match any card'; return; }
            try {
                compileRegex(pattern.regex);
                const c = matchCount.get(pattern);
                el.className = 'rgx-status ok';
                el.textContent = `✓ valid · matches ${c === undefined ? '…' : c} cards`;
            } catch (e) {
                el.className = 'rgx-status bad';
                el.textContent = `✗ ${e.message}`;
            }
        }

        function expandRow(pattern, scroll) {
            openSet.add(pattern);
            const row = rowElFor(pattern);
            if (!row) return;
            row.classList.add('open');
            const head = row.querySelector('.prow-head');
            head.setAttribute('aria-expanded', 'true');
            const body = row.querySelector('.prow-body');
            body.innerHTML = editorHTML(pattern);
            body.classList.remove('hidden');
            updateRegexStatus(row, pattern);
            autoGrowAll(body);
            if (scroll) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('focus-animation'); setTimeout(() => row.classList.remove('focus-animation'), 1500); }
        }
        function collapseRow(pattern) {
            openSet.delete(pattern);
            const row = rowElFor(pattern);
            if (!row) return;
            row.classList.remove('open');
            row.querySelector('.prow-head').setAttribute('aria-expanded', 'false');
            const body = row.querySelector('.prow-body');
            body.classList.add('hidden');
            body.innerHTML = '';
        }

        // --- CARD ANALYSIS ---
        function getMatchedPatterns(card) {
            const set = new Set();
            const fullText = (card.fullTextSections || []).join(' ').replace(/\n/g, ' ');
            ABILITIES_CONFIG.abilities.forEach(p => {
                if (p.regex === 'WILL_NOT_MATCH_TEXT') return;
                if (!p.regexObject) return;
                p.regexObject.lastIndex = 0;
                if (p.regexObject.exec(fullText)) set.add(p);
            });
            return set;
        }

        // Per-ability color cycle (from CardThreatLevelInspector.getAbilityColorClass, mapped to the ink palette)
        const ABILITY_COLORS = ['#A78BFA', '#59A7F2', '#E9B44C', '#EF6070', '#4CC38A', '#94A3B8', '#F2A65A', '#F27EB2'];
        function abilityColor(index) { return ABILITY_COLORS[index % ABILITY_COLORS.length]; }

        // Highlight every loaded ability's matches inside the card text with per-ability colors
        // (ported from CardThreatLevelInspector.analyzeAndHighlightText, using local config + esc)
        function analyzeAndHighlightText(originalText) {
            if (!originalText || originalText.trim() === '') {
                return { highlightedHtml: '', colorByName: new Map() };
            }
            const sanitizedText = originalText.replace(/\n/g, ' ');
            const allMatches = [];
            const colorByName = new Map();

            (ABILITIES_CONFIG.abilities || []).forEach((pattern, index) => {
                if (!pattern.regex || pattern.regex === 'WILL_NOT_MATCH_TEXT') return;
                let regex;
                try { regex = compileRegex(pattern.regex); } catch (e) { return; }
                let match;
                regex.lastIndex = 0;
                while ((match = regex.exec(sanitizedText)) !== null) {
                    if (match[0].length === 0) { regex.lastIndex++; continue; }
                    allMatches.push({
                        name: pattern.name,
                        color: abilityColor(index),
                        start: match.index,
                        end: match.index + match[0].length
                    });
                    colorByName.set(pattern.name, abilityColor(index));
                    if (!regex.global) break;
                }
            });

            allMatches.sort((a, b) => a.start - b.start || b.end - a.end);
            let lastEnd = -1;
            const filtered = allMatches.filter(m => {
                if (m.start < lastEnd) return false;
                lastEnd = m.end;
                return true;
            });

            let html = '';
            let lastIndex = 0;
            filtered.forEach(m => {
                html += esc(sanitizedText.substring(lastIndex, m.start));
                html += `<span class="ctext-hl" style="color:${m.color}" data-bd-ability="${esc(m.name)}" title="${esc(m.name)} — click to open this pattern">${esc(sanitizedText.substring(m.start, m.end))}</span>`;
                lastIndex = m.end;
            });
            html += esc(sanitizedText.substring(lastIndex));
            return { highlightedHtml: html, colorByName };
        }

        function displayCardDetails(card, updateSearchInput = true) {
            if (!ABILITIES_CONFIG.abilities || ABILITIES_CONFIG.abilities.length === 0) {
                toast('Load the abilities JSON first to analyze cards.');
                return;
            }
            selectedCard = card;
            if (updateSearchInput) { searchInput.value = card.fullName; searchResultsContainer.classList.add('hidden'); }

            const { rds, lvi, bcr, breakdown } = calculateCardMetrics(card);
            const ctl = rds + lvi + bcr;

            const prev = (lastLedger && lastLedger.card === card) ? lastLedger : null;
            const deltas = prev ? { rds: rds - prev.rds, lvi: lvi - prev.lvi, bcr: bcr - prev.bcr } : null;

            const meta = [card.type, card.color, (card.cost != null ? `${card.cost} ink` : '')].filter(Boolean).join(' · ');
            const fullImg = card.images && (card.images.full || card.images.thumbnail);
            const cardText = card.fullText || (card.fullTextSections || []).join('\n');
            const { highlightedHtml, colorByName } = analyzeAndHighlightText(cardText);

            const meterMax = Math.max(rds, lvi, bcr, 0.0001);
            const meterRow = (cls, lbl, val) => `<div class="meter ${cls}"><span class="meter-lbl">${lbl}</span><div class="meter-track"><div class="meter-fill" data-fill="${cls}" style="width:0"></div></div><span class="meter-val"><span data-val="${cls}">${val.toFixed(3)}</span><span class="meter-delta" data-delta="${cls}"></span></span></div>`;

            cardDetailsContainer.innerHTML = `
                <div class="card-header"><div><div class="cname display">${esc(card.fullName)}</div><div class="cmeta">${esc(meta)}</div></div></div>
                ${fullImg ? `<div class="card-img-wrap"><img src="${esc(fullImg)}" alt="${esc(card.fullName)}" onerror="this.parentElement.style.display='none'"></div>` : ''}
                <div class="stat-tiles">
                    <div class="stat-tile ctl" title="Card Threat Level = RDS + LVI + BCR"><div class="t-lbl">CTL</div><div class="t-val">${ctl.toFixed(2)}</div></div>
                    <div class="stat-tile rds" title="Resource Dominance Score"><div class="t-lbl">RDS</div><div class="t-val">${rds.toFixed(2)}</div></div>
                    <div class="stat-tile lvi" title="Lore Velocity Index"><div class="t-lbl">LVI</div><div class="t-val">${lvi.toFixed(2)}</div></div>
                    <div class="stat-tile bcr" title="Board Control Rating"><div class="t-lbl">BCR</div><div class="t-val">${bcr.toFixed(2)}</div></div>
                </div>
                <div class="ledger">
                    <div class="ledger-title">Ink Ledger</div>
                    ${meterRow('rds', 'RDS', rds)}
                    ${meterRow('lvi', 'LVI', lvi)}
                    ${meterRow('bcr', 'BCR', bcr)}
                </div>
                ${highlightedHtml ? `<div class="ctext">${highlightedHtml}</div>` : ''}
                <div class="sub-head" style="margin-top:0">Calculation Breakdown</div>
                ${breakdown.length ? breakdown.map(item => {
                    const c = colorByName.get(item.abilityName) || 'var(--ink-amber)';
                    return `<div class="bd-card">
                        <button class="bd-link" data-bd-ability="${esc(item.abilityName)}" style="color:${c}" title="Open this pattern in the editor">${esc(item.abilityName)}</button>
                        <p class="bd-contrib">Contributes <span class="val">${item.value.toFixed(3)}</span> to <span style="text-transform:capitalize;font-weight:600">${esc(item.metric.replace(/_/g, ' '))}</span></p>
                        <p class="bd-expl">${esc(item.explanation)}</p>
                    </div>`;
                }).join('') : `<div class="empty" style="padding:20px"><p>No abilities from the loaded JSON matched this card.</p></div>`}`;

            // animate ledger fills to width
            requestAnimationFrame(() => {
                [['rds', rds], ['lvi', lvi], ['bcr', bcr]].forEach(([cls, val]) => {
                    const fill = cardDetailsContainer.querySelector(`[data-fill="${cls}"]`);
                    if (fill) fill.style.width = (val > 0 ? Math.max((val / meterMax) * 100, 2) : 0) + '%';
                });
            });
            if (deltas) {
                [['rds', deltas.rds], ['lvi', deltas.lvi], ['bcr', deltas.bcr]].forEach(([cls, d]) => {
                    if (Math.abs(d) < 0.0005) return;
                    const el = cardDetailsContainer.querySelector(`[data-delta="${cls}"]`);
                    if (!el) return;
                    el.textContent = (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2);
                    el.style.color = d > 0 ? 'var(--ink-emerald)' : 'var(--ink-ruby)';
                    el.classList.add('show');
                    setTimeout(() => el.classList.remove('show'), 1500);
                });
            }
            lastLedger = { card, rds, lvi, bcr };
        }

        // --- SEARCH ---
        function handleSearch(query) {
            if (query.trim() === '') { searchResultsContainer.classList.add('hidden'); return; }
            const results = fuse.search(query, { limit: 10 });
            searchResultsContainer.innerHTML = '';
            if (results.length > 0) {
                results.forEach(result => {
                    const card = result.item;
                    const el = document.createElement('div');
                    el.className = 'search-item';
                    el.innerHTML = `<img src="${esc(card.images.thumbnail)}" alt="${esc(card.fullName)}" onerror="this.style.display='none'"><span>${esc(card.fullName)}</span>`;
                    el.addEventListener('click', () => displayCardDetails(card, true));
                    searchResultsContainer.appendChild(el);
                });
                searchResultsContainer.classList.remove('hidden');
            } else { searchResultsContainer.classList.add('hidden'); }
        }

        // --- TREE ---
        function buildAndRenderTree() {
            const patterns = ABILITIES_CONFIG.abilities;
            const tree = {};
            patterns.forEach(p => {
                const category = p.category || 'Uncategorized';
                const subType = p.sub_type || 'General';
                if (!tree[category]) tree[category] = {};
                if (!tree[category][subType]) tree[category][subType] = 0;
                tree[category][subType]++;
            });
            treeNavContainer.innerHTML = '';
            const frag = document.createDocumentFragment();

            const mkItem = (label, count, cls, ds, isActive) => {
                const el = document.createElement('div');
                el.className = 'tnav-item' + (cls ? ' ' + cls : '') + (isActive ? ' active' : '');
                el.setAttribute('role', 'button'); el.tabIndex = 0;
                const nameSpan = document.createElement('span'); nameSpan.textContent = label;
                const cnt = document.createElement('span'); cnt.className = 'count'; cnt.textContent = `(${count})`;
                el.appendChild(nameSpan); el.appendChild(cnt);
                Object.assign(el.dataset, ds);
                return el;
            };

            frag.appendChild(mkItem('Show All', patterns.length, '', { filterType: 'all' }, activeFilter.type === 'all'));

            Object.keys(tree).sort().forEach(category => {
                const catCount = Object.values(tree[category]).reduce((s, c) => s + c, 0);
                frag.appendChild(mkItem(category, catCount, '', { filterType: 'category', filterValue: category },
                    activeFilter.type === 'category' && activeFilter.value === category));

                if (Object.keys(tree[category]).length > 1 || !tree[category]['General']) {
                    Object.keys(tree[category]).sort().forEach(subType => {
                        frag.appendChild(mkItem(subType, tree[category][subType], 'subtype',
                            { filterType: 'subtype', category: category, subType: subType },
                            activeFilter.type === 'subtype' && activeFilter.category === category && activeFilter.subType === subType));
                    });
                }
            });
            treeNavContainer.appendChild(frag);
        }
        const debouncedTreeRebuild = debounce(() => { buildAndRenderTree(); rebuildFieldDatalists(); }, 500);

        function updateActiveFilterChip() {
            if (activeFilter.type === 'all') { activeFilterChip.style.display = 'none'; return; }
            activeFilterChip.style.display = 'flex';
            activeFilterLabel.textContent = activeFilter.type === 'category' ? activeFilter.value : `${activeFilter.category} › ${activeFilter.subType}`;
        }

        // --- EVENT LISTENERS ---
        jsonFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    processLoadedAbilities(JSON.parse(e.target.result), `From file at ${new Date().toLocaleTimeString()}`);
                    clearDraft();
                    draftBanner.classList.add('hidden');
                    toast('Abilities loaded.');
                } catch (err) { toast('Error parsing JSON file: ' + err.message); }
            };
            reader.readAsText(file);
            event.target.value = '';
        });

        function saveJSON() {
            if (!ABILITIES_CONFIG.abilities || ABILITIES_CONFIG.abilities.length === 0) { toast('No ability data loaded to save.'); return; }
            const patternsToSave = JSON.parse(JSON.stringify(ABILITIES_CONFIG));
            patternsToSave.abilities.forEach(p => delete p.regexObject);
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(patternsToSave, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "lorcana_abilities_redux.json");
            document.body.appendChild(a); a.click(); a.remove();
            clearDirty(); clearDraft();
            toast('Saved lorcana_abilities_redux.json');
        }
        saveJsonBtn.addEventListener('click', saveJSON);
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveJSON(); }
        });

        newAbilityBtn.addEventListener('click', () => {
            const newAbility = {
                name: "New Ability", category: "Uncategorized", sub_type: "", regex: "//gi",
                explanation: "", justification: "",
                calculation: { variables: [], contextModifiers: [], scores: {} }
            };
            try { newAbility.regexObject = compileRegex(newAbility.regex); } catch (e) { newAbility.regexObject = null; }
            ABILITIES_CONFIG.abilities.unshift(newAbility);
            openSet.add(newAbility);
            matchCount.set(newAbility, countForPattern(newAbility));
            activeFilter = { type: 'all' };
            patternFilterInput.value = '';
            updateActiveFilterChip();
            buildAndRenderTree();
            renderPatternList();
            expandRow(newAbility, true);
            markDirty();
        });

        // --- FORMULA DRAWER ---
        function openFormulaDrawer(row, pattern, path, label) {
            const drawer = row.querySelector('[data-fx-drawer]');
            if (!drawer) return;
            drawer.dataset.path = path;
            const val = getByPath(pattern, path);
            const vars = (pattern.calculation?.variables || []).map(v => v.name).filter(Boolean);
            const constPaths = flattenLeafPaths(ABILITIES_CONFIG['@constants'] || {}).map(p => '@' + p);
            const cardChips = ['@card.cost', '@card.strength', '@card.willpower', '@card.lore', '@context.lvi.survivability', '@context.lvi.questSafety'];
            const chipGroup = (lbl, arr) => arr.length ? `<div class="fx-chip-group"><div class="fx-chip-lbl">${esc(lbl)}</div><div class="fx-chips">${arr.map(t => `<button type="button" class="chip-btn" data-fx-insert="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>` : '';
            drawer.innerHTML = `
                <div class="fx-head"><span class="fx-title">${esc(label)}</span><button type="button" class="fx-close" aria-label="Close formula editor">&times;</button></div>
                <textarea class="inp ta mono fx-ta" data-path="${esc(path)}" rows="3" placeholder="e.g. baseLore * @context.lvi.survivability">${esc(val)}</textarea>
                ${chipGroup("This ability's variables", vars)}
                ${chipGroup('Constants', constPaths)}
                ${chipGroup('Card & context', cardChips)}
                <div class="fx-result neutral" data-fx-result></div>`;
            drawer.classList.remove('hidden');
            const ta = drawer.querySelector('.fx-ta');
            autoGrow(ta);
            updateFxResult(drawer, pattern, path);
            ta.focus();
            drawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        function closeFxDrawer(row, pathPrefix) {
            const drawer = row.querySelector('[data-fx-drawer]');
            if (!drawer || drawer.classList.contains('hidden')) return;
            if (pathPrefix && !(drawer.dataset.path || '').startsWith(pathPrefix)) return;
            drawer.classList.add('hidden');
            drawer.innerHTML = '';
            delete drawer.dataset.path;
        }
        function updateFxResult(drawer, pattern, path) {
            const el = drawer.querySelector('[data-fx-result]');
            if (!el) return;
            if (!selectedCard) {
                el.className = 'fx-result neutral';
                el.textContent = 'Select a card in Card Analysis to preview this score live.';
                return;
            }
            const mm = (path || '').match(/^calculation\.scores\.(\w+)\./);
            if (!mm) {
                el.className = 'fx-result neutral';
                el.textContent = `Editing against ${selectedCard.fullName} — totals update live in Card Analysis.`;
                return;
            }
            const metric = mm[1];
            const { breakdown } = calculateCardMetrics(selectedCard);
            const item = breakdown.find(b => b.abilityName === pattern.name && b.metric === metric);
            if (item) {
                el.className = 'fx-result ok';
                el.textContent = `✓ ${selectedCard.fullName}: ${item.explanation}`;
            } else {
                el.className = 'fx-result neutral';
                el.textContent = `— no score applied to ${selectedCard.fullName} (pattern not matched, condition false, or empty value)`;
            }
        }
        // Keep compact field and drawer textarea showing the same string
        function syncFormulaEditors(row, source) {
            const path = source.dataset.path;
            if (!path) return;
            row.querySelectorAll(`[data-path="${path}"]`).forEach(el => {
                if (el === source) return;
                el.value = source.value;
                if (el.matches('textarea.ta')) autoGrow(el);
            });
        }

        // Toggle expand/collapse
        patternListContainer.addEventListener('click', (e) => {
            const head = e.target.closest('.prow-head');
            if (head) {
                const row = head.closest('.prow');
                const pattern = ABILITIES_CONFIG.abilities[parseInt(row.dataset.index, 10)];
                if (openSet.has(pattern)) collapseRow(pattern); else expandRow(pattern, false);
                return;
            }
            const fxBtn = e.target.closest('.fx-open');
            if (fxBtn) {
                const row = fxBtn.closest('.prow');
                const pattern = ABILITIES_CONFIG.abilities[parseInt(row.dataset.index, 10)];
                if (pattern) openFormulaDrawer(row, pattern, fxBtn.dataset.fxPath, fxBtn.dataset.fxLabel);
                return;
            }
            const fxCloseBtn = e.target.closest('.fx-close');
            if (fxCloseBtn) {
                const row = fxCloseBtn.closest('.prow');
                if (row) closeFxDrawer(row);
                return;
            }
            const chipBtn = e.target.closest('.chip-btn');
            if (chipBtn && chipBtn.dataset.fxInsert !== undefined) {
                const drawer = chipBtn.closest('[data-fx-drawer]');
                const ta = drawer && drawer.querySelector('.fx-ta');
                if (ta) {
                    const s = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
                    const en = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
                    ta.value = ta.value.slice(0, s) + chipBtn.dataset.fxInsert + ta.value.slice(en);
                    const pos = s + chipBtn.dataset.fxInsert.length;
                    ta.selectionStart = ta.selectionEnd = pos;
                    ta.focus();
                    // Route through the normal live-edit loop (write, dirty, debounced re-analysis, sync)
                    ta.dispatchEvent(new Event('input', { bubbles: true }));
                }
                return;
            }
            const actionBtn = e.target.closest('[data-action]');
            if (!actionBtn) return;
            const row = actionBtn.closest('.prow');
            if (!row) return;
            const idx = parseInt(row.dataset.index, 10);
            const pattern = ABILITIES_CONFIG.abilities[idx];
            const action = actionBtn.dataset.action;

            if (action === 'add-variable') {
                pattern.calculation.variables = pattern.calculation.variables || [];
                pattern.calculation.variables.push({ name: "", source: "regex", group: 1, type: "textOrNumber" });
                row.querySelector('.variables-container').innerHTML = variablesHTML(pattern);
                afterCalcEdit(pattern);
            } else if (action === 'remove-variable') {
                pattern.calculation.variables.splice(parseInt(actionBtn.dataset.index, 10), 1);
                row.querySelector('.variables-container').innerHTML = variablesHTML(pattern);
                closeFxDrawer(row, 'calculation.variables');
                afterCalcEdit(pattern);
            } else if (action === 'add-modifier') {
                pattern.calculation.contextModifiers = pattern.calculation.contextModifiers || [];
                pattern.calculation.contextModifiers.push({ targetMetric: "lvi", name: "survivability", operation: "multiply", value: "1.0" });
                const mc = row.querySelector('.modifiers-container');
                mc.innerHTML = modifiersHTML(pattern);
                autoGrowAll(mc);
                afterCalcEdit(pattern);
            } else if (action === 'remove-modifier') {
                pattern.calculation.contextModifiers.splice(parseInt(actionBtn.dataset.index, 10), 1);
                const mc = row.querySelector('.modifiers-container');
                mc.innerHTML = modifiersHTML(pattern);
                autoGrowAll(mc);
                closeFxDrawer(row, 'calculation.contextModifiers');
                afterCalcEdit(pattern);
            } else if (action === 'test-search') {
                testInCardSearch(pattern);
            } else if (action === 'duplicate') {
                duplicateAbility(pattern);
            } else if (action === 'delete') {
                handleDelete(actionBtn, pattern);
            }
        });

        function afterCalcEdit(pattern) {
            markDirty();
            reAnalyzeDebounced();
        }

        // Input on editor fields
        patternListContainer.addEventListener('input', (e) => {
            const target = e.target;
            const row = target.closest('.prow');
            if (!row) return;
            const index = parseInt(row.dataset.index, 10);
            const pattern = ABILITIES_CONFIG.abilities[index];
            if (!pattern) return;

            if (target.matches('textarea.ta')) autoGrow(target);

            if (target.matches('[data-field]')) {
                const fieldName = target.dataset.field;
                pattern[fieldName] = target.value;
                if (fieldName === 'name') { const ns = row.querySelector('.prow-name'); if (ns) ns.textContent = target.value || 'Unnamed'; }
                if (fieldName === 'category' || fieldName === 'sub_type') {
                    const chip = row.querySelector('.chip');
                    if (chip) chip.textContent = [pattern.category || 'Uncategorized', pattern.sub_type].filter(Boolean).join(' · ');
                }
                if (fieldName === 'regex') {
                    try {
                        pattern.regexObject = compileRegex(target.value);
                        target.classList.remove('err');
                    } catch (err) { pattern.regexObject = null; target.classList.add('err'); }
                    const preview = row.querySelector('.prow-regex'); if (preview) preview.textContent = target.value;
                    updateRegexStatus(row, pattern);
                    refreshRowDots(pattern);
                    recomputeOneCount(pattern);
                }
            } else if (target.matches('[data-path]')) {
                const path = target.dataset.path;
                const keys = path.match(/(\w+)|\[(\d+)\]/g).map(k => k.replace(/\[|\]/g, ''));
                let current = pattern;
                for (let i = 0; i < keys.length - 1; i++) {
                    if (current[keys[i]] === undefined) { current[keys[i]] = /^\d+$/.test(keys[i + 1]) ? [] : {}; }
                    current = current[keys[i]];
                }
                current[keys[keys.length - 1]] = target.value;
                syncFormulaEditors(row, target);
            }

            markDirty();
            reAnalyzeDebounced();
            debouncedTreeRebuild();
        });

        const reAnalyzeDebounced = debounce(() => {
            selectedMatchSet = selectedCard ? getMatchedPatterns(selectedCard) : new Set();
            ABILITIES_CONFIG.abilities.forEach(refreshRowDots);
            if (selectedCard) displayCardDetails(selectedCard, false);
            // refresh live result line in any open formula drawer
            patternListContainer.querySelectorAll('.fx-drawer:not(.hidden)').forEach(dr => {
                const row = dr.closest('.prow');
                if (!row) return;
                const pat = ABILITIES_CONFIG.abilities[parseInt(row.dataset.index, 10)];
                if (pat) updateFxResult(dr, pat, dr.dataset.path);
            });
        }, 250);

        function testInCardSearch(pattern) {
            const m = (pattern.regex || '').match(/^\/(.*)\/([gimuy]*)$/);
            if (m) { customRegexInput.value = m[1]; customRegexFlags.value = m[2] || 'gi'; }
            else { customRegexInput.value = pattern.regex || ''; customRegexFlags.value = 'gi'; }
            switchInspectorTab('tester');
            if (window.innerWidth < 1024) setMobileTab('tester');
            customRegexBtn.click();
            customRegexInput.focus();
        }

        function duplicateAbility(pattern) {
            const idx = ABILITIES_CONFIG.abilities.indexOf(pattern);
            const clone = JSON.parse(JSON.stringify(pattern));
            delete clone.regexObject;
            clone.name = (clone.name || 'Unnamed') + ' (copy)';
            if (clone.regex && clone.regex !== 'WILL_NOT_MATCH_TEXT') {
                try { clone.regexObject = compileRegex(clone.regex); } catch (e) { clone.regexObject = null; }
            }
            ABILITIES_CONFIG.abilities.splice(idx + 1, 0, clone);
            matchCount.set(clone, countForPattern(clone));
            markDirty();
            buildAndRenderTree(); rebuildFieldDatalists(); renderPatternList();
            expandRow(clone, true);
            toast('Ability duplicated.');
        }

        function handleDelete(btn, pattern) {
            if (btn.dataset.confirm === '1') {
                const idx = ABILITIES_CONFIG.abilities.indexOf(pattern);
                const removed = pattern;
                ABILITIES_CONFIG.abilities.splice(idx, 1);
                openSet.delete(pattern); matchCount.delete(pattern);
                markDirty();
                buildAndRenderTree(); rebuildFieldDatalists(); renderPatternList();
                if (selectedCard) reAnalyzeDebounced();
                toast('Ability deleted.', {
                    action: 'Undo', duration: 5000,
                    onAction: () => {
                        ABILITIES_CONFIG.abilities.splice(Math.min(idx, ABILITIES_CONFIG.abilities.length), 0, removed);
                        matchCount.set(removed, countForPattern(removed));
                        markDirty();
                        buildAndRenderTree(); rebuildFieldDatalists(); renderPatternList();
                    }
                });
            } else {
                btn.dataset.confirm = '1';
                btn.textContent = 'Confirm delete';
                btn.classList.add('confirm');
                setTimeout(() => { btn.dataset.confirm = ''; btn.textContent = 'Delete'; btn.classList.remove('confirm'); }, 3000);
            }
        }

        // breakdown -> pattern link
        cardDetailsContainer.addEventListener('click', (e) => {
            const link = e.target.closest('[data-bd-ability]');
            if (!link) return;
            const name = link.dataset.bdAbility;
            const pattern = ABILITIES_CONFIG.abilities.find(p => p.name === name);
            if (!pattern) return;
            activeFilter = { type: 'all' }; patternFilterInput.value = '';
            updateActiveFilterChip(); buildAndRenderTree(); renderPatternList();
            if (window.innerWidth < 1024) setMobileTab('patterns');
            expandRow(pattern, true);
        });

        // pattern filter
        patternFilterInput.addEventListener('input', debounce(() => { renderPatternList(); }, 150));

        // search
        searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
        searchInput.addEventListener('focus', (e) => { if (e.target.value) handleSearch(e.target.value); });
        document.addEventListener('click', (e) => { if (!e.target.closest('#search-input, #search-results')) searchResultsContainer.classList.add('hidden'); });

        // tree click
        treeNavContainer.addEventListener('click', (e) => {
            const target = e.target.closest('.tnav-item');
            if (!target) return;
            const { filterType, filterValue, category, subType } = target.dataset;
            if (filterType === 'category') activeFilter = { type: 'category', value: filterValue };
            else if (filterType === 'subtype') activeFilter = { type: 'subtype', category, subType };
            else activeFilter = { type: 'all' };
            treeNavContainer.querySelectorAll('.tnav-item').forEach(el => el.classList.remove('active'));
            target.classList.add('active');
            renderPatternList();
            updateActiveFilterChip();
            closeCatSheet();
        });
        treeNavContainer.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tnav-item')) { e.preventDefault(); e.target.click(); } });

        $('clear-tree-filter').addEventListener('click', () => {
            activeFilter = { type: 'all' };
            buildAndRenderTree(); renderPatternList(); updateActiveFilterChip();
        });

        // Inspector tabs
        function switchInspectorTab(which) {
            const isAnalysis = which === 'analysis';
            $('tab-analysis').setAttribute('aria-selected', isAnalysis);
            $('tab-tester').setAttribute('aria-selected', !isAnalysis);
            $('panel-analysis').classList.toggle('active', isAnalysis);
            $('panel-tester').classList.toggle('active', !isAnalysis);
        }
        $('tab-analysis').addEventListener('click', () => switchInspectorTab('analysis'));
        $('tab-tester').addEventListener('click', () => switchInspectorTab('tester'));

        // Mobile tabs
        function setMobileTab(which) {
            panels.dataset.mtab = which;
            document.querySelectorAll('#mobile-tabs .mtab').forEach(b => b.setAttribute('aria-selected', b.dataset.mtab === which));
            if (which === 'analyze') switchInspectorTab('analysis');
            if (which === 'tester') switchInspectorTab('tester');
        }
        document.querySelectorAll('#mobile-tabs .mtab').forEach(b => b.addEventListener('click', () => setMobileTab(b.dataset.mtab)));

        // Category bottom sheet (mobile)
        function openCatSheet() { rail.classList.add('open'); catSheetBackdrop.classList.add('open'); }
        function closeCatSheet() { rail.classList.remove('open'); catSheetBackdrop.classList.remove('open'); }
        catSheetBtn.addEventListener('click', openCatSheet);
        catSheetBackdrop.addEventListener('click', closeCatSheet);

        // --- CUSTOM REGEX CARD SEARCH (ported from lorcana_abilities.html 1639-1804) ---
        customRegexBtn.addEventListener('click', () => {
            const pattern = customRegexInput.value;
            const flags = customRegexFlags.value;
            customRegexError.classList.add('hidden');
            customRegexInput.classList.remove('err');
            customRegexResults.innerHTML = '';
            let regex;
            try {
                regex = new RegExp(pattern, flags);
            } catch (err) {
                customRegexError.textContent = 'Invalid regex: ' + err.message;
                customRegexError.classList.remove('hidden');
                customRegexInput.classList.add('err');
                return;
            }

            const results = [];
            // Single toggle: unchecked = Core Constructed legality, checked = Infinity legality
            const infinityFilter = $('format-filter-infinity').checked;
            const filteredCards = infinityFilter
                ? allCards.filter(card => card.allowedInFormats && card.allowedInFormats.Infinity)
                : allCards.filter(card => card.allowedInFormats && card.allowedInFormats.Core);

            filteredCards.forEach(card => {
                let text = card.fullText || (card.fullTextSections || []).join(' ');
                text = (text).replace(/\n/g, ' ').trim();
                regex.lastIndex = 0;
                if (text && regex.test(text)) results.push({ card, text });
            });
            const cardResults = results.map(r => r.card);
            lastRegexResults = cardResults;
            displayRegexStats(cardResults);
            copyResultsBtn.classList.toggle('hidden', cardResults.length === 0);

            if (results.length === 0) {
                customRegexResults.innerHTML = '<div class="empty">No cards matched this regex.</div>';
                customRegexStats.innerHTML = '';
                return;
            }

            const fragment = document.createDocumentFragment();
            results.forEach(({ card, text }) => {
                let highlighted = '';
                let lastIndex = 0;
                let match;
                regex.lastIndex = 0;
                const matches = [];
                while ((match = regex.exec(text)) !== null) {
                    if (match[0].length === 0) break;
                    matches.push({ start: match.index, end: match.index + match[0].length });
                    if (!regex.global) break;
                }
                matches.forEach((m) => {
                    highlighted += esc(text.substring(lastIndex, m.start));
                    highlighted += `<span class="highlight">${esc(text.substring(m.start, m.end))}</span>`;
                    lastIndex = m.end;
                });
                highlighted += esc(text.substring(lastIndex));

                const { rds, lvi, bcr } = calculateCardMetrics(card);
                const ctl = rds + lvi + bcr;

                const cardDiv = document.createElement('div');
                cardDiv.className = 'rr-card';
                cardDiv.innerHTML = `
                    <img src="${esc(card.images.thumbnail)}" alt="${esc(card.fullName)}" onerror="this.style.display='none'">
                    <div>
                        <div class="rr-name">${esc(card.fullName)}</div>
                        <div class="rr-chips">
                            <span style="color:var(--ink-amethyst)" title="Card Threat Level">CTL: ${ctl.toFixed(2)}</span>
                            <span style="color:var(--ink-sapphire)" title="Resource Dominance">RDS: ${rds.toFixed(2)}</span>
                            <span style="color:var(--ink-amber)" title="Lore Velocity">LVI: ${lvi.toFixed(2)}</span>
                            <span style="color:var(--ink-ruby)" title="Board Control">BCR: ${bcr.toFixed(2)}</span>
                        </div>
                        <div class="rr-text">${highlighted.replace(/\n/g, '<br>')}</div>
                    </div>`;
                cardDiv.addEventListener('click', () => {
                    displayCardDetails(card, true);
                    switchInspectorTab('analysis');
                    if (window.innerWidth < 1024) setMobileTab('analyze');
                });
                fragment.appendChild(cardDiv);
            });
            customRegexResults.appendChild(fragment);
        });

        // Toggling the format filter re-runs the current search
        $('format-filter-infinity').addEventListener('change', () => {
            if (customRegexInput.value.trim()) customRegexBtn.click();
        });

        function displayRegexStats(results) {
            if (results.length === 0) { customRegexStats.innerHTML = ''; return; }
            const total = results.length;
            const inkCounts = results.reduce((acc, card) => { acc[card.color] = (acc[card.color] || 0) + 1; return acc; }, {});
            const typeCounts = results.reduce((acc, card) => { acc[card.type] = (acc[card.type] || 0) + 1; return acc; }, {});

            let html = `<div class="stat-block"><h4>Ink Distribution (${total} cards)</h4>`;
            INK_ORDER.forEach(ink => {
                if (!inkCounts[ink]) return;
                const perc = ((inkCounts[ink] / total) * 100);
                const parts = ink.split('-');
                const segW = perc / parts.length;
                const segs = parts.map(p => `<div class="stat-bar-seg" style="width:${segW}%;background:${INK_COLORS[p] || 'var(--ink-steel)'}"></div>`).join('');
                html += `<div class="stat-bar-row"><span>${esc(ink)}</span><div class="stat-bar-track">${segs}</div><span class="stat-num">${inkCounts[ink]} (${perc.toFixed(1)}%)</span></div>`;
            });
            html += `</div><div class="stat-block"><h4>Card Type Distribution</h4>`;
            TYPE_ORDER.forEach(type => {
                if (!typeCounts[type]) return;
                const perc = ((typeCounts[type] / total) * 100).toFixed(1);
                html += `<div style="font-size:13px;margin-bottom:3px">${esc(type)}: <span class="stat-num">${typeCounts[type]} (${perc}%)</span></div>`;
            });
            html += `</div>`;
            customRegexStats.innerHTML = html;
        }

        copyResultsBtn.addEventListener('click', () => {
            if (lastRegexResults.length === 0) return;
            const cardData = lastRegexResults.map(card => {
                const name = card.fullName;
                const abilities = (card.fullText || (card.fullTextSections || []).join('\n')).replace(/\n/g, ' ').trim();
                return `${name}: ${abilities}`;
            }).join('\n\n');
            navigator.clipboard.writeText(cardData).then(() => {
                const original = copyResultsBtn.textContent;
                copyResultsBtn.textContent = 'Copied!';
                copyResultsBtn.classList.remove('btn-secondary'); copyResultsBtn.classList.add('btn-primary');
                setTimeout(() => { copyResultsBtn.textContent = original; copyResultsBtn.classList.add('btn-secondary'); copyResultsBtn.classList.remove('btn-primary'); }, 2000);
            }).catch(err => { console.error('Failed to copy text: ', err); toast('Failed to copy card data.'); });
        });

        // --- START ---
        initializeApp();
    });
    </script>
</body>
